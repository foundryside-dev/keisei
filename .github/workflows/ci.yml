name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  # ── Stage 1: Fast feedback (every PR + push) ─────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv venv --python 3.13

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Install Rust toolchain for native Python extension
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          uv export --frozen --extra dev --extra sl --no-hashes --no-emit-project --output-file /tmp/keisei-ci-constraints.txt
          uv pip install --python .venv/bin/python -c /tmp/keisei-ci-constraints.txt torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv/bin/python -c /tmp/keisei-ci-constraints.txt -e ".[dev,sl]" psutil -e ./shogi-engine/crates/shogi-gym
          .venv/bin/python -c "import shogi_gym"

      - name: Ruff check
        run: .venv/bin/ruff check .

      - name: Mypy
        run: .venv/bin/mypy keisei/

  python-fast:
    name: Python Tests (fast)
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv venv --python ${{ matrix.python-version }}

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-uv-py${{ matrix.python-version }}-

      - name: Install Rust toolchain for native Python extension
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          uv export --frozen --extra dev --extra sl --no-hashes --no-emit-project --output-file /tmp/keisei-ci-constraints.txt
          uv pip install --python .venv/bin/python -c /tmp/keisei-ci-constraints.txt torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv/bin/python -c /tmp/keisei-ci-constraints.txt -e ".[dev,sl]" psutil -e ./shogi-engine/crates/shogi-gym
          .venv/bin/python -c "import shogi_gym"

      - name: Run fast tests
        run: .venv/bin/pytest -x --tb=short -q -n 2 -m "not slow and not integration"

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            shogi-engine/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('shogi-engine/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: shogi-engine
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: shogi-engine
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: shogi-engine
        run: cargo test

  # ── Stage 2: Full validation, including distributed regressions ──
  python-full:
    name: Python Tests (full)
    runs-on: ubuntu-latest
    needs: python-fast
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv venv --python ${{ matrix.python-version }}

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-uv-py${{ matrix.python-version }}-

      - name: Install Rust toolchain for native Python extension
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          uv export --frozen --extra dev --extra sl --no-hashes --no-emit-project --output-file /tmp/keisei-ci-constraints.txt
          uv pip install --python .venv/bin/python -c /tmp/keisei-ci-constraints.txt torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv/bin/python -c /tmp/keisei-ci-constraints.txt -e ".[dev,sl]" psutil -e ./shogi-engine/crates/shogi-gym
          .venv/bin/python -c "import shogi_gym"

      - name: Run all tests (including slow + integration)
        run: .venv/bin/pytest --tb=short -q
