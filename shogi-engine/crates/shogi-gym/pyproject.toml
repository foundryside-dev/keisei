[build-system]
requires = ["maturin>=1.12.1,<2.0"]
build-backend = "maturin"

[project]
name = "shogi-gym"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "../../python"
module-name = "shogi_gym._native"
features = ["pyo3/extension-module"]
# The Python package is outside this crate's project root. Include its sources
# explicitly so wheel builds do not depend on an editable-install source path.
include = [
    { path = "shogi_gym/*.py", format = "wheel" },
    { path = "shogi_gym/*.pyi", format = "wheel" },
    { path = "shogi_gym/py.typed", format = "wheel" },
]
